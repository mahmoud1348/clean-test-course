name: Lesson 5 SAST

on:
  push:
    branches:
      - lesson-5-complete
jobs:
  security_test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'false'
    defaults:
      run:
        working-directory: backend
    name: Execute the PyCharm security test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run PyCharm Security
        uses: tonybaloney/pycharm-security@1.25.1
        with:
          fail_on_warnings: 'yes'
  unit_test:
    needs: [security_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hangry_api/requirements.txt
          pip install pytest django_mock_queries six coverage
      - name: Unit Tests
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: test-only-key-for-ci
        run: |
          coverage run --source=./hangry_api -m pytest
          coverage report
          python hangry_api/manage.py test api.tests
  deploy:
    needs: [unit_test]
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment
  dast_scan:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://hangryhippo.quantic.host'
